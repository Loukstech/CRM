# Render Blueprint — déploiement en un clic du CRM (API NestJS + Postgres).
# Depuis le dashboard Render : New > Blueprint > sélectionner ce dépôt (branche main).
# Les variables marquées `sync: false` (MAIL_*) te seront demandées à la création.
# CORS_ORIGINS et APP_WEB_URL sont pré-remplies avec crm.timestradinginter.com.

databases:
  - name: crm-postgres
    databaseName: crm
    user: crm_app
    plan: free
    postgresMajorVersion: 16

services:
  - type: web
    name: crm-api
    runtime: node
    plan: free
    branch: workbuddy/main-7e0d91fb
    rootDir: .
    # NPM_CONFIG_PRODUCTION=false => installe aussi les devDependencies
    # (@nestjs/cli, tsx) necessaires au build et aux migrations.
    buildCommand: npm install && npm run db:generate && npm run build
    # Les migrations sont appliquees avant chaque demarrage (idempotent).
    startCommand: npm run db:migrate && npm run start:api
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: NODE_ENV
        value: production
      # Empêche npm d'ignorer les devDependencies pendant le build.
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      # Render injecte automatiquement l'URL complète (rôle crm_app, sans superuser).
      - key: DATABASE_URL
        fromDatabase:
          name: crm-postgres
          property: connectionString
      - key: DATABASE_MIGRATION_URL
        fromDatabase:
          name: crm-postgres
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL_SECONDS
        value: "900"
      - key: REFRESH_TOKEN_TTL_DAYS
        value: "30"
      - key: LOGIN_MAX_FAILED_ATTEMPTS
        value: "5"
      - key: LOGIN_LOCK_MINUTES
        value: "15"
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: "60"
      - key: RATE_LIMIT_MAX
        value: "300"
      - key: AUTH_RATE_LIMIT_MAX
        value: "20"
      # Origine du front (même domaine que l'API pour l'instant).
      - key: CORS_ORIGINS
        value: "https://crm.timestradinginter.com"
      - key: TRUST_PROXY
        value: "1"
      - key: APP_WEB_URL
        value: "https://crm.timestradinginter.com"
      - key: SWAGGER_ENABLED
        value: "0"
      - key: MAIL_DRIVER
        value: smtp
      - key: MAIL_HOST
        value: smtp.hostinger.com
      - key: MAIL_PORT
        value: "465"
      - key: MAIL_USER
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
