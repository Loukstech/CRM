# Render Blueprint — API Louk's CRM (NestJS) + interface web (Vite/React) + base Neon.
#
# Etat reel du deploiement (services crees via l'API Render, pas via Blueprint) :
#   - API  : crm-api       -> https://api-crm.timestradinginter.com
#             (URL Render interne : https://crm-api-eogq.onrender.com)
#   - Site : louks-crm-web -> https://crm.timestradinginter.com
#             (URL Render interne : https://louks-crm-web.onrender.com)
#   - Base : Neon PostgreSQL 16 (projet dark-bird-33272139, region aws-us-west-2)
#
# Le sous-domaine `crm.` porte l'interface, `api-crm.` porte l'API. Les deux CNAME
# sont pilotés dans la zone Hostinger.
#
# Deux URL de connexion distinctes, c'est volontaire :
#   DATABASE_URL           -> role crm_app     (LOGIN, NOSUPERUSER, NOBYPASSRLS) => la RLS est appliquee
#   DATABASE_MIGRATION_URL -> role neondb_owner (proprietaire) => migrations + sync des policies
# L'API refuse de demarrer si DATABASE_URL utilise un role qui contourne la RLS
# (cf. PrismaService.assertUnprivilegedRole).
#
# Les deux URL contiennent des mots de passe : elles ne sont JAMAIS commitees,
# elles sont saisies dans le dashboard Render (marquees `sync: false` ci-dessous).

services:
  - type: web
    name: crm-api
    runtime: node
    plan: free
    region: oregon
    branch: workbuddy/main-7e0d91fb
    rootDir: .
    # NPM_CONFIG_PRODUCTION=false => installe aussi les devDependencies
    # (@nestjs/cli, tsx) necessaires au build et aux migrations.
    buildCommand: npm install && npm run db:generate && npm run build
    # Les migrations sont appliquees avant chaque demarrage (idempotent).
    startCommand: npm run db:migrate && npm run start:api
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: NODE_ENV
        value: production
      # Empeche npm d'ignorer les devDependencies pendant le build.
      - key: NPM_CONFIG_PRODUCTION
        value: "false"

      # --- Base de donnees (Neon) : a saisir dans le dashboard Render ---
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_MIGRATION_URL
        sync: false

      # --- Authentification ---
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL_SECONDS
        value: "900"
      - key: REFRESH_TOKEN_TTL_DAYS
        value: "30"
      - key: LOGIN_MAX_FAILED_ATTEMPTS
        value: "5"
      - key: LOGIN_LOCK_MINUTES
        value: "15"

      # --- Limitation de debit ---
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: "60"
      - key: RATE_LIMIT_MAX
        value: "300"
      - key: AUTH_RATE_LIMIT_MAX
        value: "20"

      # --- Front / domaine ---
      - key: CORS_ORIGINS
        value: "https://crm.timestradinginter.com"
      - key: APP_WEB_URL
        value: "https://crm.timestradinginter.com"
      - key: TRUST_PROXY
        value: "1"

      # Swagger monte sur /api/docs (utile tant qu'il n'y a pas de front).
      # A repasser a "0" le jour ou l'API est ouverte au public.
      - key: SWAGGER_ENABLED
        value: "1"

      # --- E-mails transactionnels ---
      # Les instances Free de Render ne peuvent PAS emettre sur les ports 25, 465
      # et 587 (https://render.com/docs/free) : un MAIL_DRIVER=smtp y echoue par
      # « Connection timeout ». On passe donc par l'API HTTPS d'un fournisseur.
      - key: MAIL_DRIVER
        value: http
      - key: MAIL_HTTP_PROVIDER
        value: brevo
      - key: MAIL_HTTP_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false

  # Interface web — SPA React/Vite. Le routage utilise le fragment (#) pour
  # fonctionner sur un hébergeur statique sans règle de réécriture :
  # /#/verify-email?token=… ne sollicite que la racine du site.
  - type: web
    name: louks-crm-web
    runtime: static
    branch: workbuddy/main-7e0d91fb
    rootDir: .
    buildCommand: npm install && npm run build:web
    staticPublishPath: apps/web/dist
    envVars:
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: VITE_API_BASE_URL
        value: https://api-crm.timestradinginter.com
